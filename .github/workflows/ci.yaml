name: Create and publish a Docker image

# master: build, test, publish. Pull requests (e.g. Renovate): build and test only.
on:
  push:
    branches: [ master ]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: airquality:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: End-to-end test with emulated sensors
        run: uv run pytest tests/e2e -v
        env:
          AIRQUALITY_IMAGE: airquality:test

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # same build as above, so this comes straight from the cache
      - name: Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
